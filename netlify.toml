[build]
  publish = "_site"
  command = '''
    mkdir -p $HOME/opt && \
    wget -qO- https://github.com/quarto-dev/quarto-cli/releases/download/v1.6.42/quarto-1.6.42-linux-amd64.tar.gz | tar -xz -C $HOME/opt && \
    export PATH=$HOME/opt/quarto-1.6.42/bin:$PATH && \
    quarto render
  '''

[build.environment]
  PYTHON_VERSION = "3.11"
